<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shetu logo">
  <defs>
    <linearGradient id="shetuBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15b892"/>
      <stop offset="1" stop-color="#0b7d60"/>
    </linearGradient>
    <linearGradient id="shetuCap" x1="120" y1="150" x2="392" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F6F0"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#shetuBg)"/>

  <!-- graduation cap: study / learning.
       The mortarboard (diamond) + the band below it. -->
  <!-- mortarboard top -->
  <path d="M256 150 L412 224 256 298 100 224 Z" fill="url(#shetuCap)"/>
  <!-- subtle inner line on the board for depth -->
  <path d="M256 170 L372 224 256 278 140 224 Z" fill="#D2F0E6" opacity="0.55"/>

  <!-- cap band / head -->
  <path d="M176 258 L256 296 336 258 L336 318 C336 346 300 364 256 364 C212 364 176 346 176 318 Z" fill="url(#shetuCap)"/>
  <path d="M176 258 L256 296 336 258 L336 274 C336 300 300 316 256 316 C212 316 176 300 176 274 Z" fill="#C2E9DB" opacity="0.6"/>

  <!-- tassel: cord from the center button down the right side -->
  <circle cx="256" cy="224" r="12" fill="#FFC94D"/>
  <path d="M256 224 C 392 236, 404 236, 404 236 L404 320" stroke="#FFC94D" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- tassel knot + strands -->
  <circle cx="404" cy="326" r="9" fill="#FFC94D"/>
  <path d="M398 334 L398 360 M404 334 L404 364 M410 334 L410 360" stroke="#FFC94D" stroke-width="5" stroke-linecap="round"/>

  <!-- a small check mark inside the band: trusted / verified guidance -->
  <path d="M232 322 l14 14 30 -32" stroke="#0b7d60" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
